name: BroChat
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  BroKit:
    path: BroKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BroChat:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist"]
    dependencies:
      - package: BroKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRO_BUNDLE_ID)"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bro Chat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchNight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts: [Anton-Regular.ttf, Yellowtail-Regular.ttf]
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        NSBluetoothAlwaysUsageDescription: Bro Chat uses Bluetooth to find and bro the bros around you, even with no signal.
        NSLocalNetworkUsageDescription: Bro Chat finds bros on the same Wi-Fi. Nothing goes to the internet.
        NSBonjourServices: [_brochat._tcp]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.ashayas.brochat.invite
            CFBundleURLSchemes: [brochat]
  BroChatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BroChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(BRO_BUNDLE_ID).uitests"
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  BroChat:
    build:
      targets:
        BroChat: all
        BroChatUITests: [test]
    test:
      targets: [BroChatUITests]
